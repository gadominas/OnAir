<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F0F46; --ink2:#16165A; --mint:#3ACEA9; --live:#E5484D; --amber:#F5A524;
  --soft:#C9CBE8; --dim:#9FA3D6; --line:rgba(255,255,255,.14);
  --sans:'Spline Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:#fff;font-family:var(--sans);overflow:hidden}
body.nocursor{cursor:none}

[hidden]{display:none!important}
/* Layout: agenda | Q&A panel (links.wall). The columns animate between the three modes. */
.stage{display:grid;height:100vh;height:100dvh;grid-template-columns:var(--a) var(--s);transition:grid-template-columns .7s cubic-bezier(.4,0,.2,1)}
body.full  {--a:100fr;--s:0fr}
body.split {--a:60fr; --s:40fr}
body.qa    {--a:30fr; --s:70fr}
@media (prefers-reduced-motion:reduce){.stage{transition:none}}

.agenda{min-width:0;display:flex;flex-direction:column;padding:4vh 3.4vw;gap:3vh;overflow:hidden}
.slido{min-width:0;position:relative;background:#fff;overflow:hidden;transition:opacity .4s}
body.full .slido{opacity:0;visibility:hidden}
.slido iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* top line */
.top{display:flex;align-items:center;gap:1.2vw}
.pix{display:grid;grid-template-columns:repeat(4,.55vh);gap:.22vh;flex:none}
.pix i{width:.55vh;height:.55vh;background:var(--mint)}.pix i.d{opacity:.35}.pix i.o{opacity:0}
.brand{font-weight:700;font-size:clamp(14px,1.9vh,26px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--mint)}
.clock{margin-left:auto;font:600 clamp(18px,3.4vh,48px)/1 var(--mono);font-variant-numeric:tabular-nums}

/* now */
.now{display:flex;flex-direction:column;gap:1.4vh;min-height:0}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:.6em;font:600 clamp(12px,1.7vh,22px) var(--mono);
  padding:.35em .9em;border-radius:999px;background:rgba(229,72,77,.18);border:1px solid rgba(229,72,77,.5)}
.badge i{width:.6em;height:.6em;border-radius:50%;background:var(--live);animation:pulse 1.6s ease-in-out infinite}
.badge.calm{background:rgba(58,206,169,.14);border-color:rgba(58,206,169,.5)}
.badge.calm i{background:var(--mint);animation:none}
@keyframes pulse{50%{opacity:.35}}
.now h1{margin:0;font-size:clamp(26px,6.4vh,92px);line-height:1.05;letter-spacing:-.02em}
.now .who{margin:0;color:var(--soft);font-size:clamp(15px,2.6vh,36px)}
.bar{position:relative;height:clamp(8px,1.2vh,16px);background:var(--line);border-radius:999px;overflow:hidden;margin-top:1vh}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--mint);border-radius:999px}
.bar u{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.meta{display:flex;justify-content:space-between;gap:1vw;font:500 clamp(12px,1.8vh,24px) var(--mono);color:var(--soft)}

/* Q&A countdown */
.qabox{display:none;flex-direction:column;gap:1vh;padding:2.4vh 1.6vw;border-radius:2vh;container-type:inline-size;min-width:0;background:rgba(58,206,169,.12);border:1px solid rgba(58,206,169,.45)}
body.inqa .qabox{display:flex}
.qabox small{font:600 clamp(12px,1.9vh,24px) var(--mono);color:var(--mint);text-transform:uppercase;letter-spacing:.06em}
.qabox b{font:700 clamp(28px,min(15vh,30cqi),220px)/.95 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:#fff}
.qabox .qbar{height:clamp(6px,1vh,12px);background:var(--line);border-radius:999px;overflow:hidden}
.qabox .qbar i{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .25s linear}
.qabox.warn{background:rgba(245,165,36,.13);border-color:rgba(245,165,36,.55)}
.qabox.warn small,.qabox.warn b{color:var(--amber)}.qabox.warn .qbar i{background:var(--amber)}
.qabox.over{background:rgba(229,72,77,.16);border-color:rgba(229,72,77,.6)}
.qabox.over small,.qabox.over b{color:#FF8A8E}.qabox.over .qbar i{background:var(--live)}

/* next + later */
.next{padding:2vh 1.4vw;border-radius:1.8vh;background:rgba(255,255,255,.06);border:1px solid var(--line);display:flex;flex-direction:column;gap:.6vh}
.next small{font:600 clamp(11px,1.6vh,20px) var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.next b{font-size:clamp(16px,3vh,40px);line-height:1.2}
.next span{font:500 clamp(12px,1.9vh,24px) var(--mono);color:var(--mint)}
.later{list-style:none;margin:auto 0 0;padding:2vh 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15vw),1fr));gap:1.2vw}
.later li{min-width:0}
.later .t{font:600 clamp(11px,1.7vh,22px) var(--mono);color:var(--mint)}
.later .n{font-size:clamp(12px,1.9vh,24px);line-height:1.25;margin-top:.4vh;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.later .w{font-size:clamp(11px,1.5vh,19px);color:var(--dim);margin-top:.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.later:empty{display:none}
/* narrow column during Q&A: keep it to the essentials */
body.qa .later,body.qa .now .meta,body.qa .now .bar{display:none}
body.qa .now h1{font-size:clamp(20px,4.2vh,60px)}
.now h1,.next b{overflow-wrap:anywhere}
body.qa .now .who{font-size:clamp(13px,2.1vh,28px)}
body.split .later{grid-template-columns:repeat(auto-fill,minmax(min(100%,13vw),1fr))}

/* operator controls (appear on mouse move) */
.ctl{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:10;
  background:rgba(15,15,70,.92);border:1px solid var(--line);border-radius:14px;padding:8px;opacity:0;transition:opacity .3s;
  font:500 13px var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ctl.show,.ctl:focus-within{opacity:1}
.ctl span{color:var(--dim);padding:0 4px}
.ctl button{font:600 13px var(--sans);background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.ctl .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.simtag{position:fixed;top:1vh;left:50%;transform:translateX(-50%);font:600 12px var(--mono);background:#FFF4D6;color:#5A3E00;padding:4px 10px;border-radius:8px;z-index:11}
.simtag[hidden]{display:none}
.err{padding:6vh 4vw;font-size:20px}
</style>
</head>
<body class="full">

<div class="stage">
  <section class="agenda" aria-live="polite">
    <div class="top">
      <span class="pix" aria-hidden="true"><i></i><i class="d"></i><i></i><i class="o"></i><i class="d"></i><i></i><i></i><i class="d"></i><i class="o"></i><i></i><i class="d"></i><i></i></span>
      <span class="brand" id="brand"></span>
      <span class="clock" id="clock"></span>
    </div>
    <div class="now">
      <span class="badge" id="badge"><i></i><span id="badgeT"></span></span>
      <h1 id="title"></h1>
      <p class="who" id="who"></p>
      <div class="bar" id="bar"><i id="fill"></i><u id="qaSeg"></u></div>
      <div class="meta"><span id="range"></span><span id="left"></span></div>
    </div>
    <div class="qabox" id="qaBox">
      <small id="qaLbl">Q&amp;A time left</small>
      <b id="qaLeft">0:00</b>
      <div class="qbar"><i id="qaFill"></i></div>
    </div>
    <div class="next" id="next">
      <small id="nextLbl">Up next</small>
      <b id="nextTitle"></b>
      <span id="nextWhen"></span>
    </div>
    <ol class="later" id="later" aria-label="Later today"></ol>
  </section>
  <section class="slido" aria-label="Slido Q&amp;A">
    <iframe id="wall" title="Q&amp;A" allow="clipboard-write; fullscreen"></iframe>
  </section>
</div>

<div class="simtag" id="simtag" hidden></div>
<div class="ctl" id="ctl" role="toolbar" aria-label="Screen controls">
  <span>Slido</span>
  <button type="button" data-slido="auto" title="Follow the agenda (A)">Auto</button>
  <button type="button" data-slido="show" title="Always show, large (S)">Show</button>
  <button type="button" data-slido="hide" title="Always hide (H)">Hide</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="srcReload" title="Reload the Slido panel (R)">Reload Slido</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="fs" title="Full screen (F)">Full screen</button>
</div>

<script type="module">
/* ======================= agenda ======================= */
// Same source as the live agenda page: agenda.json from the host serving this page. ?agenda=<url> overrides it, ?sim=HH:MM&speed=60 rehearses a time,
// ?slido=qa shows Slido only during Q&A (default: during the whole talk, larger during Q&A).
// Q&A panel: links.wall from the agenda (any page that allows embedding, e.g. Slido's
// https://app.sli.do/event/<id>); ?wall=<url> overrides it. Without one, the agenda stays full screen.
const q = new URLSearchParams(location.search);
const AGENDA_URL = q.get("agenda") || "agenda.json";
const SLIDO_DURING_TALK = q.get("slido") !== "qa";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const bust = u => { const x = new URL(u, location.href); x.searchParams.set("_", Date.now()); return x.href; };

async function fetchAgenda() {
  const r = await fetch(bust(AGENDA_URL), { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const text = await r.text();
  return { text, data: JSON.parse(text) };
}

let EV, TALK, QA, SESSIONS, EVENT_START, EVENT_END, agendaText, fmt, agendaWall;
const wallUrl = () => q.get("wall") || agendaWall;
function loadWall(force) {
  const url = wallUrl(), f = $("wall");
  if (url && (force || f.dataset.src !== url)) { f.src = url; f.dataset.src = url; } // load once; keep it alive
}
// Optional colours from agenda.json: { "ink", "accent" } (any CSS colour).
function applyTheme(t = {}) {
  for (const [k, v] of [["ink", "--ink"], ["accent", "--mint"]]) t[k] ? document.documentElement.style.setProperty(v, t[k]) : document.documentElement.style.removeProperty(v);
}
function setData(a) {
  EV = a.event; TALK = a.timing.talkMinutes; QA = a.timing.qaMinutes; SESSIONS = a.sessions;
  // Per-talk Q&A: a talk's "qa" minutes (default timing.qaMinutes) end its slot; the talk part is the rest.
  SESSIONS.forEach(s => s.qaMin = s.kind === "talk" ? Math.max(0, Math.min(s.dur, s.qa ?? QA)) : 0);
  const date0 = Date.parse(`${EV.date}T00:00:00${EV.utcOffset}`);
  SESSIONS.forEach(s => { s.from = date0 + toMin(s.start) * 60000; s.to = s.from + s.dur * 60000; });
  EVENT_START = SESSIONS[0].from; EVENT_END = SESSIONS.at(-1).to;
  fmt = new Intl.DateTimeFormat("en-GB", { timeZone: EV.timeZone, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  document.title = `${EV.name} · Stage screen`;
  applyTheme(a.theme);
  $("brand").innerHTML = `${esc(EV.brand?.title || EV.name)}${EV.brand?.number ? ` <span>${esc(EV.brand.number)}</span>` : ""}${EV.city ? ` · ${esc(EV.city)}` : ""}`;
  agendaWall = a.links?.wall || "";
  loadWall();
}
try {
  const got = await fetchAgenda();
  agendaText = got.text;
  setData(got.data);
} catch (e) {
  document.querySelector(".agenda").innerHTML = `<div class="err">Couldn't load the agenda (${esc(e.message)}). Check the connection; this page retries on reload.</div>`;
  setTimeout(() => location.reload(), 30000);
  throw e;
}

/* ======================= clock ======================= */
let sim = null; // { base, anchor, speed }
const simParam = q.get("sim");
if (simParam && /^\d{1,2}:\d{2}(:\d{2})?$/.test(simParam)) {
  const [h, m, sec = 0] = simParam.split(":").map(Number);
  sim = { base: Date.parse(`${EV.date}T00:00:00${EV.utcOffset}`) + (h * 3600 + m * 60 + sec) * 1000, anchor: performance.now(), speed: +(q.get("speed") || 1) };
}
const now = () => sim ? sim.base + (performance.now() - sim.anchor) * sim.speed : Date.now();
const hhmm = ms => fmt.format(new Date(ms));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const minsLeft = ms => Math.max(1, Math.ceil(ms / 60000));
const line = s => s.title + (s.who && s.kind !== "break" ? ` — ${s.who}` : "");

/* ======================= render ======================= */
let slidoMode = "auto"; // auto | show | hide (operator override)
function setLayout(mode) {
  // No Q&A panel configured: the agenda always has the full screen.
  const forced = !wallUrl() ? "full" : slidoMode === "show" ? "qa" : slidoMode === "hide" ? "full" : mode;
  for (const c of ["full", "split", "qa"]) document.body.classList.toggle(c, c === forced);
}

function tick() {
  const t = now();
  $("clock").textContent = hhmm(t);
  const ci = SESSIONS.findIndex(s => t >= s.from && t < s.to);
  const ni = SESSIONS.findIndex(s => s.from > t);
  const cur = ci >= 0 ? SESSIONS[ci] : null;
  let mode = "full", badge = "", calm = true, title = "", who = "", range = "", left = "", fill = 0, qaSeg = 0, showBar = false;
  let upNext = ni >= 0 ? SESSIONS[ni] : null;      // what the "Up next" card shows
  let laterFrom = ni >= 0 ? ni + 1 : SESSIONS.length;

  if (t < EVENT_START) {
    const d = EVENT_START - t, days = Math.floor(d / 86400000);
    badge = "Starts soon"; title = EV.name;
    who = `${EV.dateText || ""} · doors ${hhmm(EVENT_START)}`;
    left = days ? `in ${days}d ${Math.floor(d % 86400000 / 3600000)}h` : `in ${mmss(d)}`;
    range = EV.venue || "";
    upNext = SESSIONS[0]; laterFrom = 1;
  } else if (cur) {
    const elapsed = t - cur.from, total = cur.to - cur.from;
    const isTalk = cur.kind === "talk", qaStart = cur.to - cur.qaMin * 60000, inQa = cur.qaMin > 0 && t >= qaStart;
    title = cur.title; who = cur.who ? cur.who + (cur.role ? ", " + cur.role : "") : "";
    range = `${hhmm(cur.from)}–${hhmm(cur.to)}`; showBar = true;
    fill = elapsed / total * 100; qaSeg = cur.qaMin / cur.dur * 100;
    if (cur.kind === "break") { badge = cur.title === "Lunch" ? "Lunch break" : "Coffee break"; who = `Back at ${hhmm(cur.to)}`; left = `${minsLeft(cur.to - t)} min left`; }
    else if (inQa) {
      mode = "qa"; badge = "Q&A"; calm = false;
      const qaLeft = cur.to - t, qaTotal = cur.to - qaStart;
      $("qaLeft").textContent = mmss(qaLeft);
      $("qaFill").style.width = (qaLeft / qaTotal * 100).toFixed(2) + "%";
      $("qaBox").classList.toggle("warn", qaLeft <= 60000);
      $("qaLbl").textContent = qaLeft <= 60000 ? "Last minute of Q&A" : "Q&A time left";
    } else {
      mode = isTalk && SLIDO_DURING_TALK ? "split" : "full";
      badge = "On stage"; calm = false;
      left = isTalk ? `Q&A in ${minsLeft(qaStart - t)} min` : `${minsLeft(cur.to - t)} min left`;
    }
  } else if (ni >= 0) {
    // Changeover: next speaker getting ready. Slido is hidden; show the next session big.
    const n = SESSIONS[ni], prevEnd = ni > 0 ? SESSIONS[ni - 1].to : n.from;
    badge = "Up next"; title = n.title; who = n.who ? n.who + (n.role ? ", " + n.role : "") : "";
    range = `Starts at ${hhmm(n.from)}`; left = `in ${mmss(n.from - t)}`; showBar = true;
    fill = Math.min(1, (t - prevEnd) / Math.max(1, n.from - prevEnd)) * 100;
    upNext = SESSIONS[ni + 1] ?? null; laterFrom = ni + 2;
  } else {
    badge = "That's a wrap"; title = EV.city ? `Thank you, ${EV.city}!` : "Thank you!"; who = EV.name;
    upNext = null; laterFrom = SESSIONS.length;
  }

  setLayout(mode);
  document.body.classList.toggle("inqa", mode === "qa"); // the countdown only exists during a real Q&A
  $("badgeT").textContent = badge;
  $("badge").classList.toggle("calm", calm);
  $("title").textContent = title;
  $("who").textContent = who;
  $("range").textContent = range;
  $("left").textContent = left;
  $("bar").hidden = !showBar;
  $("fill").style.width = fill.toFixed(2) + "%";
  $("qaSeg").style.width = qaSeg + "%";

  $("next").hidden = !upNext;
  if (upNext) {
    $("nextLbl").textContent = t < EVENT_START ? "First up" : "Up next";
    $("nextTitle").textContent = line(upNext);
    $("nextWhen").textContent = t < EVENT_START ? hhmm(upNext.from) : `${hhmm(upNext.from)} · in ${minsLeft(upNext.from - t)} min`;
  }
  const later = SESSIONS.slice(laterFrom, laterFrom + 4);
  const html = later.map(x => `<li><div class="t">${hhmm(x.from)}</div><div class="n">${esc(x.title)}</div>${x.who && x.kind !== "break" ? `<div class="w">${esc(x.who)}</div>` : ""}</li>`).join("");
  if ($("later").dataset.k !== html) { $("later").innerHTML = html; $("later").dataset.k = html; }

  $("simtag").hidden = !sim || q.has("quiet");          // ?quiet hides the test tag (demos, screenshots)
  if (sim) $("simtag").textContent = `Test time ${hhmm(t)}${sim.speed > 1 ? ` · ${sim.speed}×` : ""}`;
}
tick();
setInterval(tick, 250);

/* ======================= operator controls ======================= */
function setSlido(m) {
  slidoMode = m;
  document.querySelectorAll("[data-slido]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.slido === m)));
  tick();
}
setSlido("auto");
document.querySelectorAll("[data-slido]").forEach(b => b.addEventListener("click", () => setSlido(b.dataset.slido)));
const toggleFull = () => document.fullscreenElement ? document.exitFullscreen().catch(() => {}) : document.documentElement.requestFullscreen?.().catch(() => {});
$("fs").addEventListener("click", toggleFull);
document.addEventListener("fullscreenchange", () => $("fs").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen");
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "a") setSlido("auto"); else if (k === "s") setSlido("show"); else if (k === "h") setSlido("hide"); else if (k === "f") toggleFull();
});
let ctlTimer;
function poke() {
  $("ctl").classList.add("show"); document.body.classList.remove("nocursor");
  clearTimeout(ctlTimer);
  ctlTimer = setTimeout(() => { $("ctl").classList.remove("show"); document.body.classList.add("nocursor"); }, 2500);
}
addEventListener("mousemove", poke);
poke();
// Keep the screen awake while this page is showing.
let wake = null;
const keepAwake = async () => { try { if ("wakeLock" in navigator && !wake && !document.hidden) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {} };
keepAwake();
document.addEventListener("visibilitychange", keepAwake);

// Reload just the Slido panel.
$("srcReload").addEventListener("click", () => loadWall(true));
addEventListener("keydown", e => { if (!e.metaKey && !e.ctrlKey && !e.altKey && e.key.toLowerCase() === "r" && e.target === document.body) loadWall(true); });

/* ======================= auto-reload ======================= */
// Every 20 s: if the agenda or this page changed, reload. In full screen a reload would drop out of it,
// so agenda changes are applied in place instead and the reload waits until full screen ends.
const hash = str => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return h; };
const pageHash = () => fetch(bust(location.href.split("#")[0]), { cache: "no-store" }).then(r => r.ok ? r.text() : Promise.reject()).then(hash);
let baseHash = null, reloadPending = false;
pageHash().then(h => baseHash = h).catch(() => {});
function reloadNow() {
  try { sessionStorage.setItem("stage-slido", slidoMode); } catch (e) {}
  location.reload();
}
try { const m = sessionStorage.getItem("stage-slido"); if (m) { setSlido(m); sessionStorage.removeItem("stage-slido"); } } catch (e) {}
async function check() {
  let fresh = null, changed = false;
  try { const got = await fetchAgenda(); if (got.text !== agendaText && got.data?.sessions?.length) fresh = got; } catch (e) {}
  try { if (baseHash !== null) changed = (await pageHash()) !== baseHash; } catch (e) {}
  if (fresh || changed) reloadPending = true;
  if (!reloadPending) return;
  if (!document.fullscreenElement) return reloadNow();
  if (fresh) { agendaText = fresh.text; setData(fresh.data); tick(); }
}
setInterval(check, 20000);
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && reloadPending) reloadNow(); });
</script>
</body>
</html>
